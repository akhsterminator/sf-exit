name: Feature request
description: Suggest something that would help you get data out of Salesforce
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: For example, migrating to X, backing up to Y, or archiving before shutting an org down.
    validations: { required: true }
  - type: textarea
    id: solution
    attributes:
      label: What would help?
  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a PR for this
