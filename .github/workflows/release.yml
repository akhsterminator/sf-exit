name: Release

# Runs when a release is published: in the GitHub UI (Releases → Draft a new release →
# create tag "vX.Y.Z" → Generate release notes → Publish) or with `gh release create vX.Y.Z`.
# Or push a version tag (git tag v1.2.3 && git push origin v1.2.3): the release-assets
# job then creates the GitHub release itself, with notes taken from CHANGELOG.md.
# Publishing a release in the UI can fire both triggers for the same tag: every job is
# idempotent (PyPI skips files it already has, assets are uploaded with --clobber).
on:
  release:
    types: [published]
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist }

  pypi:
    # One-time setup: on pypi.org add a "trusted publisher" for this repo,
    # workflow release.yml, environment "pypi".
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  major-tag:
    # Keep "uses: akhsterminator/sf-exit@v0" pointing at the newest v0.x release.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"

  release-assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - name: Create the release when triggered by a tag push
        if: github.event_name == 'push'
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            version="${GITHUB_REF_NAME#v}"
            awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  binaries:
    # Single-file executables: no Python needed. Built after the release exists.
    needs: release-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, asset: sf-exit-linux-x86_64 }
          - { os: ubuntu-24.04-arm, asset: sf-exit-linux-arm64 }
          - { os: macos-latest, asset: sf-exit-macos-arm64 }
          - { os: windows-latest, asset: sf-exit-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller ".[duckdb,jwt]"
      - run: python scripts/build_binary.py --name ${{ matrix.asset }}
      - name: Smoke test
        shell: bash
        run: |
          ./dist/${{ matrix.asset }} --version
          ./dist/${{ matrix.asset }} export --help > /dev/null
          ./dist/${{ matrix.asset }} audit --help > /dev/null
      - name: Upload to the release
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" "dist/${{ matrix.asset }}" --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  checksums:
    needs: [release-assets, binaries]
    if: always() && needs.release-assets.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: SHA256SUMS for every release asset
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'sf-exit-*' --pattern 'sf_exit-*'
          sha256sum * > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
