[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "sf-exit"
dynamic = ["version"]
description = "Leave Salesforce with all your data. One command exports every object, file and attachment to CSV, then loads it into SQLite, DuckDB, Postgres or Parquet."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "sf-exit contributors" }]
keywords = [
  "salesforce", "export", "backup", "migration", "data-migration", "bulk-api",
  "crm", "etl", "duckdb", "sqlite", "postgres", "parquet", "data-portability",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: System :: Archiving :: Backup",
  "Topic :: Utilities",
]
dependencies = [
  "requests>=2.28",
  "click>=8.1",
  "rich>=13.0",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.1"]
parquet = ["duckdb>=1.1"]
postgres = ["psycopg[binary]>=3.1"]
jwt = ["pyjwt[crypto]>=2.8"]
all = ["duckdb>=1.1", "psycopg[binary]>=3.1", "pyjwt[crypto]>=2.8"]
dev = ["pytest>=7", "ruff>=0.5", "duckdb>=1.1"]

[project.scripts]
sf-exit = "sf_exit.cli:main"

[project.urls]
Homepage = "https://github.com/akhsterminator/sf-exit"
Documentation = "https://github.com/akhsterminator/sf-exit#readme"
Issues = "https://github.com/akhsterminator/sf-exit/issues"
Changelog = "https://github.com/akhsterminator/sf-exit/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/sf_exit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sf_exit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
